[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fft-di"
version = "0.1.0"
description = "FFT-based direct integration solver for Rayleigh-Sommerfeld diffraction."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "FFT-DI contributors" }
]
keywords = [
  "diffraction",
  "rayleigh-sommerfeld",
  "fft",
  "fourier optics",
  "computational optics"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9"
]

[project.urls]
Homepage = "https://github.com/zc345922764-hue/FFT-DI"
Repository = "https://github.com/zc345922764-hue/FFT-DI"
Issues = "https://github.com/zc345922764-hue/FFT-DI/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
fft-di = "fft_di.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
