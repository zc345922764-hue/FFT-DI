[io]
input_mat = sample_input.mat
output_npz = ../results/sample_output.npz
field_key = u0
wavelength_keys = lambda,wavelength
x_key = x
y_key = y

[run]
mode = plane
backend = numpy
device = auto
target_z_m = 0.02
z_start_m = 0.01
z_end_m = 0.03
z_steps = 5
use_simpson = true

[validation]
strict_checks = false
theta_max_deg = 0.0
rho_mode = corner
rho_custom_m = auto
